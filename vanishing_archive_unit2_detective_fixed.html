<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Vanishing Archive — Unit 2 Detective</title><meta name="description" content="Public Unit 2 Internet vocabulary detective game."><style>
:root{--panel:rgba(8,18,31,.9);--text:#f3f7fb;--muted:#b4c5d5;--accent:#76d0ff;--gold:#ffd56a;--good:#7be2aa;--bad:#ff8080}*{box-sizing:border-box}body{margin:0;background:#050b14;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit}#app{min-height:100vh;position:relative;overflow:hidden}.scene{position:fixed;inset:0;background:#07111f center/cover no-repeat;z-index:0}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(4,12,24,.35),rgba(2,7,13,.82))}.lobby{background-image:url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1800&q=80')}.library{background-image:url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1800&q=80')}.network{background-image:url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1800&q=80')}.server{background-image:url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1800&q=80')}.browser{background-image:url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1800&q=80')}.cctv{background-image:url('https://images.unsplash.com/photo-1557597774-9d273605dfa9?auto=format&fit=crop&w=1800&q=80')}.security{background-image:url('https://images.unsplash.com/photo-1563013544-824ae1b704d3?auto=format&fit=crop&w=1800&q=80')}.firewall{background-image:url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1800&q=80')}.final{background-image:url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1800&q=80')}.content{position:relative;z-index:2;max-width:1050px;margin:auto;padding:24px 18px 42px;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.brand{font-weight:900;letter-spacing:.04em}.case{color:var(--gold);font-size:.78rem;text-transform:uppercase}.bar{height:7px;background:#ffffff20;border-radius:99px;margin:12px 0 22px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent);transition:.35s}.card{background:var(--panel);border:1px solid #9abddd45;border-radius:20px;padding:26px;box-shadow:0 20px 70px #0008;backdrop-filter:blur(9px)}.hero{min-height:72vh;display:grid;place-items:center;text-align:center}.hero h1{font-size:clamp(2.5rem,7vw,5.7rem);margin:.15em 0;text-shadow:0 8px 35px #000}.hero p{max-width:700px;color:var(--muted);font-size:1.08rem;line-height:1.6}.eyebrow{color:var(--accent);font-weight:900;letter-spacing:.13em;text-transform:uppercase;font-size:.75rem}h2{font-size:clamp(1.5rem,4vw,2.5rem);margin:.25em 0 .5em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.option{text-align:left;min-height:68px;border:1px solid #547391;background:#102b43;color:white;border-radius:12px;padding:12px 16px;cursor:pointer}.option:hover{background:#17405f}.option.correct{border-color:var(--good);background:#2b8d5b33}.option.wrong{border-color:var(--bad);background:#b63b3b33}.feedback{min-height:28px;margin-top:14px}.good{color:var(--good)}.bad{color:var(--bad)}button{border:1px solid #537b9d;background:#102b43;color:white;border-radius:12px;padding:11px 17px;cursor:pointer}button:hover{background:#17405f}.primary{background:#176b9d;border-color:#66bce9}.gold{background:#6e571b;border-color:#e2c45f}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill,.tag{padding:6px 10px;border-radius:999px;background:#75c9ff18;border:1px solid #75c9ff40;color:#d1efff;font-size:.75rem}.clue{border-left:4px solid var(--gold);padding:15px 18px;background:#ffd56a12;margin:18px 0;line-height:1.55}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.evidence{padding:15px;border:1px dashed #8799aa80;border-radius:13px;background:#ffffff0b}.suspects{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.suspect{text-align:center}.avatar{font-size:2.2rem}.small{font-size:.84rem;color:var(--muted)}footer{text-align:center;color:#8195a8;font-size:.75rem;margin-top:auto;padding-top:25px}@media(max-width:720px){.grid,.board,.suspects{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.card{padding:20px}.content{padding:18px 12px 30px}}
</style></head><body><div id="app"><div id="scene" class="scene lobby"></div><main id="content" class="content"></main></div><script>
const missions=[
{scene:'library',name:'The Silent Library',level:'Easy',focus:'Computing Device • Computing System • Computing Network • Path',qs:[
['A machine that can run a program, including a computer, tablet, server, router, or smart sensor, is a…',['computing device','computing system','computing network','path'],0],
['Several computing devices and programs working together for one purpose form a…',['computing device','computing system','computing network','server'],1],
['A group of connected computing devices that can send or receive data is a…',['computing network','computing system','path','protocol'],0],
['A series of connections between a sender and a receiver on a network is called a…',['packet','path','router','datastream'],1],
['The librarian says the archive moved from one machine to another. Which term describes the machine itself?',['computing device','computing network','path','protocol'],0]],clue:'A terminal record shows that the missing archive moved between connected devices instead of staying on one computer. Someone used the school network.'},
{scene:'network',name:'The Network Map',level:'Easy–Medium',focus:'Bandwidth • Protocol • IP Address • Router • Packet',qs:[
['The maximum amount of data that can be sent in a fixed amount of time is…',['bandwidth','internet speed','packet','path'],0],
['An agreed-upon set of rules for how a system behaves is a…',['protocol','router','server','URL'],0],
['The unique number assigned to a device on the Internet is its…',['IP address','URL','packet','domain name'],0],
['A computer that forwards data across a network is a…',['router','client','server','browser'],0],
['A larger message broken into smaller chunks for network transmission creates…',['packets','URLs','cookies','pixels'],0]],clue:'The network map shows packets passing through a router. The investigator also finds the IP address of the device that requested the archive.'},
{scene:'server',name:'The Server Room',level:'Medium',focus:'TCP • UDP • Client • Server • Datastream',qs:[
['Which protocol provides reliable, ordered, error-checked delivery of packets?',['TCP','UDP','HTTP','DNS'],0],
['Which protocol is designed for fast transmission with minimal error checking?',['UDP','TCP','HTTP','IP'],0],
['A computer that requests data stored on another computer is a…',['client','server','router','ISP'],0],
['A computer that waits for and responds to requests for data is a…',['server','client','browser','packet'],0],
['Information traveling through the Internet in packets is called a…',['datastream','metadata','cookie','URL'],0]],clue:'The server log reveals a client requested the missing file. The transfer used TCP, meaning the request was designed to arrive reliably and in order.'},
{scene:'browser',name:'The Web Trail',level:'Medium',focus:'DNS • URL • HTTP • Web Browser • Web Page',qs:[
['Which system translates a domain name such as example.com into an IP address?',['DNS','HTTP','TCP','URL'],0],
['An easy-to-remember address used to reach a web page is a…',['URL','IP address','packet','protocol'],0],
['Which protocol is used for transmitting web pages over the Internet?',['HTTP','UDP','DNS','WLAN'],0],
['An application used to locate and display web pages is a…',['web browser','web page','server','search engine'],0],
['A document that can display text, graphics, audio, and video through a browser is a…',['web page','URL','browser','DNS'],0],
['A site name is translated to an IP address before the browser requests the page. Which concept performs the translation?',['DNS','HTTP','TCP','packet'],0]],clue:'The web trail connects a URL to a DNS lookup and then to an HTTP request. The missing archive was accessed through a web page rather than a local file.'},
{scene:'cctv',name:'The Camera Feed',level:'Medium–Hard',focus:'Metadata • Packet Metadata • Cookie • Digital Certificate • Certificate Authority',qs:[
['Data that describes other data is called…',['metadata','datastream','packet','protocol'],0],
['Data added to a packet to help route it and reassemble the original message is…',['packet metadata','cookie','URL','IP address'],0],
['A piece of website data stored in a browser that the website can retrieve later is a…',['cookie','digital certificate','packet','firewall'],0],
['A notice that helps guarantee a website is legitimate is a…',['digital certificate','cookie','URL','protocol'],0],
['An organization that issues digital certificates is a…',['certificate authority','search engine','ISP','router'],0],
['The camera records extra information about an event but not the file itself. Which broad concept fits?',['metadata','bandwidth','TCP','WLAN'],0]],clue:'The camera system cannot show the file, but its metadata shows a browser session and a valid digital certificate were involved. The evidence points to a web-based login.'},
{scene:'security',name:'The Privacy Room',level:'Hard',focus:'PII • Privacy Policy • Phishing • Internet Censorship • Net Neutrality',qs:[
['Information that identifies, links, relates to, or describes an individual is…',['PII','metadata','cookie','URL'],0],
['A policy explaining what information a website collects and what it will do with it is a…',['privacy policy','digital certificate','protocol','firewall'],0],
['A technique that tricks a user into providing personal information is…',['phishing','malware','DDoS attack','encryption'],0],
['The attempt to control or suppress what people can access, publish, or view online is…',['Internet censorship','net neutrality','bandwidth','broadband'],0],
['The principle that ISPs should provide access without favoring or blocking particular products or websites is called…',['net neutrality','Internet censorship','privacy policy','PII'],0],
['A fake message asks a student to enter personal information. Which concept describes the method, not the information?',['phishing','PII','cookie','metadata'],0]],clue:'A suspicious message was sent before the archive disappeared. It tried to collect personal information. The method was phishing; the information it targeted could be PII.'},
{scene:'firewall',name:'The Security Lab',level:'Hard',focus:'Malware • Virus • Ransomware • DDoS • Keylogging • Rogue Access Point',qs:[
['Software designed to infiltrate or damage a computer system without informed consent is…',['malware','cookie','protocol','metadata'],0],
['A malicious program that can copy itself and gain unauthorized access to a computer is a…',['virus','firewall','server','browser'],0],
['Software that encrypts programs and data until a ransom is paid is…',['ransomware','antivirus software','phishing','DDoS attack'],0],
['An attack that overwhelms a target with traffic from many computers is a…',['DDoS attack','virus','keylogging','phishing'],0],
['A program that records a user’s keystrokes to obtain confidential information is…',['keylogging','ransomware','firewall','cookie'],0],
['A wireless access point that gives unauthorized access to a secure network is a…',['rogue access point','router','WLAN','server'],0],
['Which term is the broad category that can include malicious software such as a virus or ransomware?',['malware','DDoS attack','phishing','cookie'],0]],clue:'Security logs show no ransomware payment, but they do show an unauthorized wireless access point. The attacker’s entry point was a rogue access point, not the phishing message.'},
{scene:'security',name:'The Lockdown',level:'Expert',focus:'Strong Password • MFA • Antivirus • Firewall • Encryption • Decryption',qs:[
['A password that is memorable for the user but difficult for others to guess is a…',['strong password','cookie','digital certificate','URL'],0],
['A system that requires at least two steps to unlock protected information is…',['multifactor authentication','strong password','firewall','encryption'],0],
['Software that scans a computer for known viruses and removes them is…',['antivirus software','firewall','decryption','DNS'],0],
['Software that allows or blocks network traffic according to security rules is a…',['firewall','router','browser','server'],0],
['Encoding a message so unauthorized people cannot read it is…',['encryption','decryption','cipher','metadata'],0],
['Reversing encryption to reproduce the original plain text is…',['decryption','encryption','protocol','phishing'],0],
['Which statement best distinguishes encryption from decryption?',['Encryption hides readable data; decryption restores it.','Encryption restores data; decryption hides it.','They are exactly the same process.','Neither changes how a message is represented.'],0]],clue:'The final security report shows that the archive was protected by encryption and multiple authentication steps. The person who reached it had legitimate-looking credentials but used an unauthorized network entry point.'}
];
const suspects=[{name:'Jordan',role:'Student Assistant',icon:'🧑‍💻'},{name:'Morgan',role:'Library Aide',icon:'📚'},{name:'Riley',role:'Club Leader',icon:'🧢'},{name:'Sam',role:'Network Helper',icon:'🛜'}];
let state={screen:'intro',mission:0,q:0,score:0,streak:0,clues:[],selected:null,answered:false,finalCorrect:false};
const content=document.getElementById('content'),scene=document.getElementById('scene');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setScene(c){scene.className='scene '+c}function pct(){return Math.round((state.mission/8)*100)}
function base(inner){content.innerHTML=`<div class="top"><div><div class="brand">🕵️ THE VANISHING ARCHIVE</div><div class="case">Unit 2 • Internet Detective</div></div><div class="small">Score: ${state.score} • Streak: ${state.streak}</div></div><div class="bar"><i style="width:${pct()}%"></i></div>${inner}<footer>Public classroom vocabulary game • Unit 2 review</footer>`}
function render(){setScene(state.screen==='intro'||state.screen==='briefing'?'lobby':state.screen==='board'||state.screen==='final'||state.screen==='result'?'final':missions[Math.min(state.mission,missions.length-1)].scene);if(state.screen==='intro')intro();else if(state.screen==='briefing')briefing();else if(state.screen==='quiz')quiz();else if(state.screen==='clue')clue();else if(state.screen==='board')board();else if(state.screen==='final')final();else result()}
function intro(){base(`<section class="hero"><div class="card"><div class="tag">🌙 CASE FILE 02</div><h1>The Vanishing Archive</h1><p>A school research archive disappeared from a secure web portal. Follow changing scenes, solve vocabulary challenges, collect clues, and connect the evidence.</p><div class="suspects">${suspects.map(s=>`<div class="card suspect"><div class="avatar">${s.icon}</div><b>${s.name}</b><div class="small">${s.role}</div></div>`).join('')}</div><div class="actions" style="justify-content:center"><button class="primary" onclick="startCase()">Open Case →</button></div><p class="small">8 locations • Easy → Expert • New scene + new clue at every stage</p></div></section>`)}
function startCase(){state.screen='briefing';render()}function briefing(){base(`<section class="card"><div class="eyebrow">Case briefing</div><h2>The archive disappeared at 9:42 PM.</h2><p>The school’s research archive was stored on a web server. The file is gone, but the system still contains traces of the network, browser session, and security events.</p><div class="board"><div class="evidence"><b>Last known location</b><p>School Web Archive</p></div><div class="evidence"><b>Important time</b><p>9:42 PM</p></div><div class="evidence"><b>Suspects</b><p>Four people nearby</p></div></div><div class="clue"><b>Your mission:</b> each challenge unlocks a new piece of evidence. Similar terms will be mixed together, and later scenes require application rather than memorization.</div><div class="actions"><button class="primary" onclick="beginMission()">Begin Investigation →</button></div></section>`)}
function beginMission(){state.screen='quiz';state.q=0;state.answered=false;state.selected=null;render()}
function quiz(){let m=missions[state.mission],q=m.qs[state.q],total=m.qs.length;base(`<section class="card"><div class="eyebrow">Mission ${state.mission+1} • ${m.level}</div><h2>${m.name}</h2><div class="meta"><span class="pill">${esc(m.focus)}</span><span class="pill">Question ${state.q+1}/${total}</span></div><div class="question">${esc(q[0])}</div><div class="grid">${q[1].map((o,i)=>`<button class="option ${state.answered&&i===q[2]?'correct':''} ${state.answered==='wrong'&&state.selected===i&&i!==q[2]?'wrong':''}" ${state.answered==='correct'?'disabled':''} onclick="answer(${i})"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</button>`).join('')}</div><div class="feedback">${state.answered==='correct'?'<span class="good">✓ Correct. Evidence logged.</span>':state.answered==='wrong'?'<span class="bad">✗ Not this one. Try another answer.</span>':'Choose the best answer based on the Unit 2 vocabulary.'}</div><div class="actions">${state.answered==='correct'?`<button class="primary" onclick="nextQuestion()">${state.q===total-1?'Reveal Clue →':'Next Question →'}</button>`:''}</div></section>`)}
function answer(i){if(state.answered==='correct')return;let correct=missions[state.mission].qs[state.q][2];state.selected=i;if(i===correct){state.answered='correct';state.score+=100;state.streak++}else{state.answered='wrong';state.streak=0}render()}
function nextQuestion(){if(state.q<missions[state.mission].qs.length-1){state.q++;state.answered=false;state.selected=null;render()}else{state.clues.push(missions[state.mission].clue);state.screen='clue';render()}}
function clue(){let m=missions[state.mission];base(`<section class="card"><div class="eyebrow">Evidence unlocked</div><h2>🔎 Clue #${state.clues.length}</h2><div class="clue"><b>FIELD NOTE</b><p>${esc(m.clue)}</p></div><p class="small">The scene changes for the next stage, and the vocabulary difficulty increases.</p><div class="actions"><button class="primary" onclick="continueCase()">Continue Investigation →</button></div></section>`)}
function continueCase(){if(state.mission<missions.length-1){state.mission++;state.screen='quiz';state.q=0;state.answered=false;state.selected=null;render()}else{state.screen='board';render()}}
function board(){base(`<section class="card"><div class="eyebrow">Investigation Board</div><h2>Connect the evidence</h2><p>The clues form a chain: network path → client request → web session → metadata → phishing attempt → rogue access point → protected archive.</p><div class="board">${state.clues.map((c,i)=>`<div class="evidence"><b>Clue ${i+1}</b><p>${esc(c)}</p></div>`).join('')}</div><div class="clue"><b>Final deduction:</b> Which suspect best matches the complete evidence trail? Consider network access and the unauthorized wireless entry point.</div><div class="suspects">${suspects.map((s,i)=>`<button class="card suspect" onclick="choose(${i})"><div class="avatar">${s.icon}</div><b>${s.name}</b><div class="small">${s.role}</div></button>`).join('')}</div></section>`)}
function choose(i){state.selected=i;state.screen='final';render()}function final(){let s=suspects[state.selected];base(`<section class="card center"><div class="eyebrow">Final Investigation</div><h2>Who accessed the missing archive?</h2><div class="card" style="max-width:520px;margin:20px auto"><div class="avatar">${s.icon}</div><h3>${s.name}</h3><p class="small">${s.role}</p><p>Review all eight clues before submitting. The strongest connection is the suspect linked to network access and the rogue access point.</p></div><div class="actions" style="justify-content:center"><button class="gold" onclick="solve()">Submit Deduction</button></div></section>`)}
function solve(){state.finalCorrect=state.selected===3;state.screen='result';render()}function result(){base(`<section class="hero"><div class="card center"><div style="font-size:4rem">${state.finalCorrect?'🕵️':'🔍'}</div><h1>${state.finalCorrect?'Case Solved!':'Keep Investigating'}</h1><p>${state.finalCorrect?'The evidence trail points to Sam, the network helper. You connected the network, web, privacy, and security clues.':'Your deduction does not match the complete evidence trail. Review the clues and try again.'}</p><div class="meta" style="justify-content:center"><span class="pill">Score: ${state.score}</span><span class="pill">Clues: ${state.clues.length}/8</span></div><div class="actions" style="justify-content:center"><button class="primary" onclick="restart()">Play Again</button></div></div></section>`)}function restart(){state={screen:'intro',mission:0,q:0,score:0,streak:0,clues:[],selected:null,answered:false,finalCorrect:false};render()}render();
</script></body></html>
